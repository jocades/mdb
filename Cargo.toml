[package]
name = "mdb"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["display", "from", "deref", "deref_mut"] }
rustyline = { version = "18.0.1" }
tabled = { version = "0.22.0", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
